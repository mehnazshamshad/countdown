<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta information about the page -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A count down timer">
    <title>Timer </title>
    <style>
        body{
            margin: 0%;
            padding: 0%;
            font-family: sans-serif;
            display: flex;
            flex-direction:column ;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(rgba(15, 6, 12, 0.55),rgba(20, 8, 63, 0.65)),url("pexels-samerdaboul-1209999.jpg") no-repeat center/cover;
        }
        h2{
            font-size: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            color:white;
        }
        .container{
            display: flex;
        }
        .container div{
            margin: 40px;
            position: relative;
        }
        .container span{
            width: 110px;
            height: 50px;
            background: rgb(170, 170, 215);
            backdrop-filter: blur(10px);
            opacity: .9;
            color:brown;
            display: flex;
            justify-content: center;
            font-size: 20px;
            align-items: center;
            border-radius: 12px;
        }
        .container #lable{
            height: 50px;
            width: 110px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background-color: rgb(121, 156, 215);
        }
    </style>
    </head>
    <body>
        <h2>countdown timer</h2>
        <div class="container">
            <div>
                <span id="day">00</span>
                <span id="lable">Day</span>
            </div>
            <div>
                <span id="hour">00</span>
                <span id="lable">Hours</span>
            </div>
            <div>
                <span id="minute">00</span>
                <span id="lable">Minutes</span>
            </div>
            <div>
                <span id="second">00</span>
                <span id="lable">Second</span>
            </div>
        </div>
        <script>
            const targetDate= new Date().getTime()+(30*24*60*60*1000);
            let count=setInterval(function(){
           const now=new Date() .getTime();
           const difference=targetDate-now;
           //Convert Milliseconds into Days
           const Days=Math.floor(difference/(1000*60*60*24));
           //calculate hour
           const hour=Math.floor(difference%(1000*60*60*24)/(1000*60*60));
           //calculate minutes
           const minute=Math.floor(difference%(1000*60*60)/(1000*60));
           //calculate second
           const second=Math.floor(difference%(1000*60)/(1000));

           document.getElementById("day").innerHTML=Days;
           document.getElementById("hour").innerHTML=hour;   
           document.getElementById("minute").innerHTML=minute;  
           document.getElementById("second").innerHTML=second;  

           if(difference<=0){
            clearInterval(count)
            console.log("Countdown finished!");
            }
           },1000);
        </script>
    </body>

    </html>
